<script>
(function () {
  var app = "https://apps.apple.com/app/apple-store/id6801880838?pt=499375&ct=paylasim-sonuc&mt=8";
  var play = "";
  var kokler = {"ar": "/ar/", "de": "/de/", "en": "/en/", "es": "/es/", "fr": "/fr/", "id": "/id/", "it": "/it/", "ja": "/ja/", "pt": "/pt/", "ru": "/ru/", "tr": "/", "zh": "/zh/"};
  var ua = navigator.userAgent || "";
  // iPadOS Safari masaüstü tarayıcısı gibi görünüyor: dokunmatik Mac yok, ondan ayrılıyor
  var ios = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  var hedef = "";
  if (ios) hedef = app;
  else if (/Android/i.test(ua) && play) hedef = play;
  else {
    var istekler = navigator.languages || [navigator.language || ""];
    for (var i = 0; i < istekler.length && !hedef; i++) {
      var k = (istekler[i] || "").split("-")[0].toLowerCase();
      if (kokler.hasOwnProperty(k)) hedef = kokler[k];
    }
    if (!hedef) hedef = "/";
  }
  location.replace(hedef);
})();
</script>
