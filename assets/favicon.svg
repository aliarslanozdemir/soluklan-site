<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Zeminsiz işaret: sekmede yalnız yaprak/akciğer görünüyor (Ali, 17 Eylül 2026).
       Gövde çizgisi hem açık hem koyu sekmede okunsun diye orta tonda; `prefers-color-scheme`
       destekleyen tarayıcıda ayrıca koyu zeminde açılıyor. -->
  <defs>
    <linearGradient id="gl" x1="20" y1="80" x2="80" y2="20"><stop stop-color="#2A86CC"/><stop offset="1" stop-color="#43AEE4"/></linearGradient>
    <linearGradient id="gm" x1="20" y1="80" x2="80" y2="20"><stop stop-color="#18C1AE"/><stop offset="1" stop-color="#5FC6EE"/></linearGradient>
  </defs>
  <style>
    .stem { stroke: #4E86A8; }
    @media (prefers-color-scheme: dark) { .stem { stroke: #9FC6DC; } }
  </style>
  <path d="M46 26 C30 27 18 46 24 68 C40 70 50 54 46 26Z" fill="url(#gl)"/>
  <path d="M54 26 C70 27 82 46 76 68 C60 70 50 54 54 26Z" fill="url(#gm)"/>
